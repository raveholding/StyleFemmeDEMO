/* Sistema RAVE · Servicios (turnos, agenda, comisiones) · Rave Holding
   Panel: sidebar colapsable + topbar + bento. Página pública con estilo propio (prefijo .mn-), no contamina al panel. */
:root{
  --bg:#F6F3F1; --surface:#FFFFFF; --surface-2:#F8F4F2; --ink:#221A1E; --ink-2:#6F6268; --line:#EAE1E3;
  --accent:#9C3D5A; --accent-ink:#FFFFFF; --accent-soft:#F6E4EA;
  --gold:#B88A5A; --gold-soft:#F6EBDD;
  --ok:#1F7A4D; --ok-soft:#E2F3EA; --warn:#9A5800; --warn-soft:#FBEED6; --bad:#B3261E; --bad-soft:#FBE7E5;
  --info:#2D5F9E; --info-soft:#E3ECF8; --mute:#6E6A73; --mute-soft:#EEECEF;
  --fiscal:#1D5FA8; --fiscal-soft:#E5EEF9; --interno:#9A5800; --interno-soft:#FBEED6;
  --s1:#9C3D5A; --s2:#C9A27E; --s3:#4F6D8F; --s4:#5E8C6A; --s5:#8A5FB0; --s6:#C2703D;
  --shadow:0 1px 2px rgba(34,26,30,.05),0 12px 30px -16px rgba(34,26,30,.22);
  --overlay:rgba(24,14,18,.55);
  --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-s:10px; --r-m:15px; --r-l:20px; --side-w:252px; --hh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141113; --surface:#1D191B; --surface-2:#262124; --ink:#F3EDF0; --ink-2:#B5A9AF; --line:#352D31;
    --accent:#E58AA6; --accent-ink:#2A0D17; --accent-soft:#3A1F29;
    --gold:#E2BC8C; --gold-soft:#3A2D1C;
    --ok:#5CC48F; --ok-soft:#14301F; --warn:#EBAE55; --warn-soft:#3A2A10; --bad:#F28B82; --bad-soft:#3E1B18;
    --info:#82B0EE; --info-soft:#16283C; --mute:#A9A3AC; --mute-soft:#2B272D;
    --fiscal:#7DB2F2; --fiscal-soft:#16283C; --interno:#EBAE55; --interno-soft:#3A2A10;
    --s1:#E58AA6; --s2:#E2BC8C; --s3:#8FB3DA; --s4:#8CC79B; --s5:#C3A2E6; --s6:#F0A877;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.68);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1D191B; --surface-2:#262124; --ink:#F3EDF0; --ink-2:#B5A9AF; --line:#352D31;
  --accent:#E58AA6; --accent-ink:#2A0D17; --accent-soft:#3A1F29;
  --gold:#E2BC8C; --gold-soft:#3A2D1C;
  --ok:#5CC48F; --ok-soft:#14301F; --warn:#EBAE55; --warn-soft:#3A2A10; --bad:#F28B82; --bad-soft:#3E1B18;
  --info:#82B0EE; --info-soft:#16283C; --mute:#A9A3AC; --mute-soft:#2B272D;
  --fiscal:#7DB2F2; --fiscal-soft:#16283C; --interno:#EBAE55; --interno-soft:#3A2A10;
  --s1:#E58AA6; --s2:#E2BC8C; --s3:#8FB3DA; --s4:#8CC79B; --s5:#C3A2E6; --s6:#F0A877;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.68);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.app.collapsed{--side-w:78px}
.side{position:sticky;top:0;height:100vh;align-self:start;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;overflow:hidden}
.logo svg{width:100%;height:100%}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--font-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;flex-direction:column;gap:3px}
.nav-b{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--ink-2);font-weight:600;text-align:left;min-height:44px}
.nav-b:hover{background:var(--surface-2);color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-b .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;display:grid;gap:10px}
.credit{font-size:11.5px;color:var(--ink-2);line-height:1.4;padding:0 6px}
.credit a{color:inherit}
.collapse{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink-2);font-weight:600}
.collapse svg{transition:transform .2s}
.app.collapsed .collapse svg{transform:rotate(180deg)}
.app.collapsed .nav-b span,.app.collapsed .brand-t,.app.collapsed .collapse span,.app.collapsed .credit,.app.collapsed .nav-b .cnt{display:none}
.app.collapsed .nav-b,.app.collapsed .collapse{justify-content:center}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:62px}
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
.top-l .ctx{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn .dotn{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.who{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--c,#8a6)}
.av.lg{width:52px;height:52px;font-size:18px}
.cashpill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px}
.content{padding-inline:clamp(14px,3vw,32px);padding-block:22px 40px;width:100%;max-width:1560px;margin-inline:auto;flex:1}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-h h1{font-size:clamp(25px,3.6vw,34px);font-weight:800}
.sub{color:var(--ink-2);margin-top:4px;max-width:70ch}
.tabbar{display:none}

/* ---------- Cards / Bento ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;font-family:var(--font-body)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.big{font-family:var(--font-display);font-size:clamp(30px,4.4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.02;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mid{font-family:var(--font-display);font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2)}
.row-sp{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.kv4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv4 small{display:block;color:var(--ink-2);font-size:12px}
.kv4 b{font-size:19px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.rank li b{font-variant-numeric:tabular-nums}
.rank .tr{grid-column:1/-1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.rank .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alist li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.alist li>span:first-child{min-width:0;overflow-wrap:anywhere}

/* ---------- Pills / buttons ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}.pill.fiscal{background:var(--fiscal-soft);color:var(--fiscal)}.pill.interno{background:var(--interno-soft);color:var(--interno)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);min-height:44px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent);filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1203}
.btn.ghost{background:none}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink-2);min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink-2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Forms ---------- */
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
.in::placeholder{color:color-mix(in srgb,var(--ink-2) 70%,transparent)}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.in{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.form{display:grid;gap:14px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.sw{flex:none;position:relative;width:52px;height:30px;border-radius:999px;border:0;padding:0;background:var(--line)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"] i{transform:translateX(22px)}
.warn-box{padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600}
.info-box{padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--warn);font-size:13px;font-weight:600}
.ok-box{padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:600}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:normal}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.thumb-s{width:52px;height:40px;border-radius:9px;object-fit:cover;display:block;background:var(--surface-2)}

/* ---------- AGENDA ---------- */
.ag-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ag-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-date b{font-family:var(--font-display);font-size:18px;min-width:0}
.ag-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ag-stats .card{padding:14px 16px}
.ag-stats b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.ag-stats .lbl{display:flex;align-items:center;gap:8px}
.ag-stats .lbl i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ag-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);max-height:calc(100vh - 150px)}
.ag{display:grid;position:relative;min-width:100%}
.ag-h{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 10px;display:flex;align-items:center;gap:10px;min-width:0;border-left:1px solid var(--line)}
.ag-h b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-h small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-corner{position:sticky;top:0;left:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ag-times{position:sticky;left:0;z-index:3;background:var(--surface)}
.ag-times span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.ag-col{position:relative;border-left:1px solid var(--line);cursor:copy;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 50%,transparent) 1px,transparent 1px);
  background-size:100% var(--hh),100% calc(var(--hh) / 2)}
.ag-col.off{background-color:var(--surface-2)}
.ag-block{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,var(--surface-2) 0 8px,transparent 8px 16px);pointer-events:none}
.appt{position:absolute;left:4px;right:4px;border:0;border-left:4px solid var(--c);background:var(--cs);color:var(--ink);border-radius:10px;padding:5px 8px;text-align:left;font-size:12.5px;line-height:1.25;overflow:hidden;box-shadow:0 4px 14px -10px rgba(0,0,0,.5);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.appt:hover{filter:brightness(.98);box-shadow:0 8px 20px -12px rgba(0,0,0,.55);z-index:2}
.appt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.appt .tm{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--c)}
.appt.st-cancelado,.appt.st-no_vino{opacity:.55;text-decoration:line-through}
.appt .badge{position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--c);color:#fff}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.alist2{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow);width:100%}
.arow .t{font-family:var(--font-mono);font-weight:700;font-size:15px}
.arow small{display:block;color:var(--ink-2);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--c);background:var(--cs)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 8px transparent}}

/* Drawer */
.drawer-o{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.dr-b{flex:1;overflow-y:auto;padding:16px 20px;display:grid;gap:16px;align-content:start}
.dr-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px;background:var(--surface)}
.g2f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2f .btn{white-space:normal;line-height:1.15}
.mini-x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;font-size:16px;line-height:1;display:grid;place-items:center;flex:none}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.fbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
.fk{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:12.5px;line-height:1.15;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.fk kbd{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.fk:hover{border-color:var(--ink-2)}
.fk.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fk.pri kbd{background:rgba(255,255,255,.2);color:inherit;border-color:transparent}
.fk.danger{color:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:9px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--surface-2)}
.tn{font-weight:700;line-height:1.2;overflow-wrap:anywhere;font-size:14px}
.tp{font-variant-numeric:tabular-nums;font-weight:800}
.ts{color:var(--ink-2);font-size:12px}
.ts.low{color:var(--bad);font-weight:700}
.tocobrar{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.tocobrar .tc{flex:none;min-width:200px;max-width:240px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-m);padding:10px 12px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:2px}
.tocobrar .tc small{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tocobrar .tc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket{display:grid;gap:12px}
.lines{list-style:none;margin:0;padding:0;display:grid;border-block:1px solid var(--line);max-height:46vh;overflow:auto}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--line);border-radius:8px;cursor:pointer}
.lines li[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lines small{display:block;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.lines .chg{color:var(--warn);font-weight:700}
.empty{padding:22px 8px;text-align:center;color:var(--ink-2);font-size:14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tot .t{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.docbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700}
.docbar .mono{white-space:nowrap}
.docbar.interno{background:var(--interno-soft);color:var(--interno)}
.docbar.fiscal{background:var(--fiscal-soft);color:var(--fiscal)}
.cashbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medios{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:8px}
.medio{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.medio kbd{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.medio[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.paylist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.paylist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:14px}
.bigtot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;border-radius:var(--r-m);background:var(--ink);color:var(--bg)}
.bigtot b{font-family:var(--font-display);font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ticketbar{display:none}

/* ---------- Modal / numpad / toast ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:var(--overlay)}
.overlay.l2{z-index:70}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:calc(100dvh - 20px);overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.modal.wide{max-width:780px}
.m-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.m-h h2{font-size:23px}
.m-h small{color:var(--ink-2)}
.x-btn{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;flex:none;display:grid;place-items:center}
.np-disp{min-height:64px;display:flex;align-items:center;justify-content:flex-end;padding:10px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-mono);font-size:32px;font-weight:600;margin-bottom:12px;overflow:hidden}
.np-disp.empty-v{font-family:var(--font-body);font-size:16px;color:var(--ink-2);font-weight:600}
.np-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.np-k{min-height:60px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.np-k:active{background:var(--surface-2)}
.np-act{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.np-act .btn{white-space:nowrap;min-height:52px;padding:8px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:90;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.notif{position:fixed;right:16px;top:74px;z-index:85;display:grid;gap:8px;width:min(340px,calc(100% - 32px))}
.notif div{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;font-weight:600;animation:slide .2s;color:var(--ink)}

/* Ticket impreso */
.rc{border:1px dashed var(--line);border-radius:var(--r-m);padding:18px;display:grid;gap:10px;background:var(--surface-2);font-size:13.5px}
.rc-h{text-align:center;display:grid;gap:2px}
.rc-h b{font-family:var(--font-display);font-size:18px}
.rc ul{list-style:none;margin:0;padding:8px 0;border-block:1px dashed var(--line);display:grid;gap:6px}
.rc li{display:flex;justify-content:space-between;gap:10px}
.rc .legal{text-align:center;font-weight:800;letter-spacing:.04em;font-size:12px;padding:6px;border:1px solid currentColor;border-radius:8px}
.qrbox{background:#fff;padding:8px;border-radius:12px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;display:block}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:76mm;font:12px/1.35 'Courier New',monospace;color:#000}
  #printArea .rc{border:0;background:none;padding:0}
  #printArea.sheet{width:100%;font:12px/1.4 Arial,sans-serif}
  @page{margin:4mm}
}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(80% 60% at 20% 0%,var(--accent-soft),transparent 70%),var(--bg)}
.login-card{width:min(960px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.login-l{padding:30px;background:var(--login-bg);color:#fff;display:grid;gap:18px;align-content:space-between}
.login-l h1{font-size:clamp(28px,4vw,38px);line-height:1.05}
.login-l p{opacity:.9}
.login-r{padding:28px;display:grid;gap:16px;align-content:start}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,132px),1fr));gap:10px}
.ubtn{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;min-height:56px;min-width:0}
.ubtn span:last-child{min-width:0}
.ubtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.ubtn b{display:block;font-size:14px}
.ubtn small{display:block;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinrow{display:flex;gap:10px;justify-content:center;margin:4px 0}
.pinrow i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.pinrow i.f{background:var(--ink);border-color:var(--ink)}

/* ---------- Calendario / chart ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:11px;font-weight:700;color:var(--ink-2);text-align:center;text-transform:uppercase}
.cal .d{min-height:62px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;display:grid;align-content:space-between;background:var(--surface);min-width:0;overflow:hidden}
.cal .d.ok{background:var(--ok-soft);border-color:transparent}
.cal .d.miss{background:var(--bad-soft);border-color:transparent}
.cal .d.today{outline:2px solid var(--ink)}
.cal .d.out{opacity:.35}
.cal .d b{font-size:11px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--ink-2)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Sellos */
.stampcard{border-radius:22px;padding:20px;color:var(--sc-ink,#fff);background:var(--sc-bg);display:grid;gap:14px;box-shadow:0 20px 40px -24px rgba(0,0,0,.6);position:relative;overflow:hidden}
.stampcard .st-grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px}
.stampcard .st{aspect-ratio:1;border-radius:50%;border:2px dashed currentColor;display:grid;place-items:center;opacity:.55;font-weight:800;font-size:13px}
.stampcard .st.on{opacity:1;border-style:solid;background:var(--sc-on);color:var(--sc-on-ink)}
.stampcard .st.on svg{width:58%;height:58%}
.stampcard .st.prize{border-style:solid;opacity:.9}

/* Google */
.gprev{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:grid;gap:6px}
.gprev .gt{font-size:19px;font-weight:700;color:var(--info)}
.gprev .stars{color:#E8A317;letter-spacing:1px}
.cartel{border-radius:18px;padding:20px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--cartel-bg);color:var(--cartel-ink);max-width:320px}
.cartel .qrbox{width:170px}
.cartel b{font-family:var(--font-menu);font-size:24px;line-height:1.05}

/* ---------- PÁGINA PÚBLICA (.mn-) ---------- */
.mn{background:var(--mn-bg);color:var(--mn-ink);min-height:100vh;font-family:var(--font-body)}
.mn a{color:inherit}
.mn-hero{position:relative;color:var(--mn-hero-ink);padding:18px clamp(16px,4vw,40px) 34px;background:var(--mn-hero-bg);overflow:hidden;isolation:isolate}
.mn-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--mn-hero-deco);pointer-events:none}
.mn-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1080px;margin:0 auto}
.mn-top .logo{width:46px;height:46px}
.mn-staff{border:1px solid var(--mn-staff-line);background:var(--mn-staff-bg);color:inherit;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.mn-hero-in{max-width:1080px;margin:26px auto 0;display:grid;gap:12px}
.mn-kicker{font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mn-kicker)}
.mn-hero h1{font-family:var(--font-menu);font-weight:var(--mn-h1-w,600);font-size:clamp(46px,11vw,96px);line-height:.9;letter-spacing:var(--mn-h1-ls,-.02em)}
.mn-hero h1 em{font-style:italic;color:var(--mn-kicker)}
.mn-hero p.lead{max-width:56ch;font-size:16.5px;opacity:.92}
.mn-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mn-meta>span,.mn-meta>a{display:inline-flex;align-items:center;gap:6px;background:var(--mn-chip-bg);border:1px solid var(--mn-chip-line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none}
.mn-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.mn-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--mn-radius,14px);border:1px solid var(--mn-line);background:var(--mn-card);color:var(--mn-ink);font-weight:800;font-size:14.5px;white-space:nowrap;text-decoration:none}
.mn-btn.pri{background:var(--mn-accent);border-color:var(--mn-accent);color:var(--mn-accent-ink)}
.mn-btn.ghost{background:transparent;color:inherit;border-color:var(--mn-chip-line)}
.mn-btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.mn-btn.block{width:100%}
.mn-btn[disabled]{opacity:.45;cursor:not-allowed}
.mn-btn.sm{min-height:38px;padding:6px 14px;font-size:13.5px}
.mn-cats{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--mn-bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--mn-line)}
.mn-cats-in{max-width:1080px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:12px clamp(16px,4vw,40px);scrollbar-width:none}
.mn-cats-in::-webkit-scrollbar{display:none}
.mn-cat{flex:none;border:1px solid var(--mn-line);background:var(--mn-card);color:var(--mn-ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;min-height:40px}
.mn-cat[aria-pressed="true"]{background:var(--mn-ink);color:var(--mn-bg);border-color:var(--mn-ink)}
.mn-body{max-width:1080px;margin:0 auto;padding:18px clamp(16px,4vw,40px) 130px}
.mn-sec{margin:14px 0 30px;scroll-margin-top:70px}
.mn-sec h2{font-family:var(--font-menu);font-size:clamp(28px,5vw,40px);font-weight:var(--mn-h2-w,600);margin-bottom:14px;display:flex;align-items:center;gap:12px;letter-spacing:var(--mn-h1-ls,-.01em)}
.mn-sec h2::after{content:"";flex:1;height:1px;background:var(--mn-line)}
.mn-sec .mn-sub{color:var(--mn-ink2);margin:-6px 0 14px;max-width:62ch}
.mn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.mn-item{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;background:var(--mn-card);border:1px solid var(--mn-line);border-radius:var(--mn-card-r,20px);padding:10px;box-shadow:var(--mn-shadow);min-width:0;transition:border-color .15s}
.mn-item.sel{border-color:var(--mn-accent);box-shadow:0 0 0 2px var(--mn-accent) inset,var(--mn-shadow)}
.mn-item img{width:118px;height:auto;aspect-ratio:1;align-self:start;object-fit:cover;border-radius:calc(var(--mn-card-r,20px) - 6px);cursor:zoom-in;display:block}
.mn-item h3{font-family:var(--font-menu);font-size:var(--mn-item-fs,21px);font-weight:var(--mn-h2-w,600);line-height:1.1;overflow-wrap:anywhere;letter-spacing:var(--mn-item-ls,0)}
.mn-item p{font-size:13px;color:var(--mn-ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mn-item .pr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.mn-item .pr b{font-size:17px;font-variant-numeric:tabular-nums}
.mn-item .pr small{display:block;font-size:12px;color:var(--mn-ink2);font-weight:700}
.mn-add{border:0;background:var(--mn-accent);color:var(--mn-accent-ink);border-radius:12px;min-height:40px;min-width:44px;padding:0 14px;font-weight:800;font-size:14px}
.mn-add.on{background:var(--mn-ink);color:var(--mn-bg)}
.mn-dur{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--mn-ink2)}
.mn-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.mn-pro{background:var(--mn-card);border:1px solid var(--mn-line);border-radius:var(--mn-card-r,20px);padding:16px;display:grid;gap:8px;justify-items:start;box-shadow:var(--mn-shadow)}
.mn-pro b{font-family:var(--font-menu);font-size:20px}
.mn-pro small{color:var(--mn-ink2);font-size:13px}
.mn-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:stretch}
.mn-panel{background:var(--mn-card);border:1px solid var(--mn-line);border-radius:var(--mn-card-r,20px);padding:20px;display:grid;gap:12px;box-shadow:var(--mn-shadow);align-content:start}
.mn-panel h3{font-family:var(--font-menu);font-size:25px;font-weight:var(--mn-h2-w,600)}
.mn-panel p{color:var(--mn-ink2)}
.mn-map{position:relative;border-radius:16px;min-height:150px;overflow:hidden;background:var(--mn-map-bg);display:grid;place-items:center}
.mn-map svg{position:absolute;inset:0;width:100%;height:100%}
.mn-map .pinlbl{position:relative;z-index:1;background:var(--mn-card);color:var(--mn-ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:0 10px 20px -12px rgba(0,0,0,.5)}
.mn-hours{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.mn-hours li{display:flex;justify-content:space-between;gap:10px}
.mn-hours li.today{font-weight:800;color:var(--mn-ink)}
.mn-cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 24px));display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border:0;border-radius:18px;background:var(--mn-ink);color:var(--mn-bg);font-weight:800;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);text-align:left}
.mn-cartbar small{display:block;font-weight:600;opacity:.8;font-size:12.5px}
.mn-foot{border-top:1px solid var(--mn-line);padding:26px clamp(16px,4vw,40px) 120px;color:var(--mn-ink2);font-size:13.5px}
.mn-foot-in{max-width:1080px;margin:0 auto;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.mn-foot b{display:block;color:var(--mn-ink);font-family:var(--font-menu);font-size:20px;margin-bottom:4px}
.mn-note{margin:4px 0 14px;padding:10px 14px;border-radius:12px;background:var(--mn-note-bg);color:var(--mn-note-ink);font-size:13.5px;font-weight:700}
.mn-rating{display:inline-flex;align-items:center;gap:6px}
.mn-rating .stars{color:#F2B01E;letter-spacing:1px}
/* Modal con paleta del menú */
.mnv .modal{background:var(--mn-card);color:var(--mn-ink)}
.mnv .x-btn{background:var(--mn-bg);color:var(--mn-ink)}

.mnv .in:focus{outline-color:var(--mn-accent)}
.mnv .m-h small,.mnv .note,.mnv .empty{color:var(--mn-ink2)}

.mnv .check input{accent-color:var(--mn-accent)}
.mnv .m-h h2{font-family:var(--font-menu);font-size:28px;font-weight:var(--mn-h2-w,600)}
.mn-big{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}
.bk-steps{display:flex;gap:6px;margin:-4px 0 16px}
.bk-steps i{flex:1;height:4px;border-radius:9px;background:var(--mn-line)}
.bk-steps i.on{background:var(--mn-accent)}
.bk-list{display:grid;gap:8px}
.bk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--mn-line);border-radius:14px;font-size:14px}
.bk-row b{display:block}
.bk-row small{color:var(--mn-ink2);font-size:12.5px}
.bk-pros{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.bk-pro{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--mn-line);border-radius:14px;background:var(--mn-card);color:var(--mn-ink);text-align:left;min-height:62px;min-width:0}
.bk-pro[aria-pressed="true"]{border-color:var(--mn-accent);box-shadow:inset 0 0 0 2px var(--mn-accent)}
.bk-pro b{display:block;font-size:14.5px}
.bk-pro small{display:block;color:var(--mn-ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.bk-day{flex:none;width:64px;padding:8px 4px;border:1px solid var(--mn-line);border-radius:14px;background:var(--mn-card);color:var(--mn-ink);display:grid;gap:0;justify-items:center;font-weight:800}
.bk-day small{font-size:11px;text-transform:uppercase;color:var(--mn-ink2);font-weight:800}
.bk-day b{font-size:20px;font-family:var(--font-menu)}
.bk-day[aria-pressed="true"]{background:var(--mn-ink);color:var(--mn-bg);border-color:var(--mn-ink)}
.bk-day[aria-pressed="true"] small{color:inherit;opacity:.8}
.bk-day[disabled]{opacity:.35;cursor:not-allowed}
.bk-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.bk-slot{min-height:44px;border:1px solid var(--mn-line);border-radius:12px;background:var(--mn-card);color:var(--mn-ink);font-weight:800;font-family:var(--font-mono);font-size:14px}
.bk-slot[aria-pressed="true"]{background:var(--mn-accent);color:var(--mn-accent-ink);border-color:var(--mn-accent)}
.bk-sum{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--mn-bg);border:1px solid var(--mn-line);font-size:14px}
.bk-sum .row-sp{flex-wrap:nowrap}
.bk-ok{display:grid;justify-items:center;text-align:center;gap:10px;padding:6px 0 4px}
.bk-ok .tick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--mn-accent);color:var(--mn-accent-ink)}
.bk-ok .tick svg{width:32px;height:32px}
.bk-actions{display:grid;gap:8px}

/* Horarios (Administración) */
.hrow{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
@media (max-width:440px){.hrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hrow .check{grid-column:1/-1}}

@media (max-width:1180px){.fbar{grid-template-columns:repeat(4,minmax(0,1fr))}.ag-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

}

  .app{grid-template-columns:minmax(0,1fr)}

  .bento>*{grid-column:1/-1}

  .tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink-2);padding:7px 0;border-radius:12px;font-size:10.5px;font-weight:700}

  .tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tab .cnt{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;display:grid;place-items:center}
  .content{padding-bottom:110px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}

  .ag-stats .card{padding:10px 12px}.ag-stats b{font-size:21px}.ag-stats .lbl{font-size:10.5px;white-space:nowrap}.ag-stats .note{display:none}

  .ag-wrap{max-height:none}
}

}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

function openNumpad(o){

  openModal(mh(esc(o.title),o.sub?esc(o.sub):'',2)+'<div class="np-disp" id="npDisp"></div><div class="np-grid">'
    +['1','2','3','4','5','6','7','8','9',(o.decimals?',':''),'0','⌫'].map(function(k){return k?'<button class="np-k" data-act="npKey" data-k="'+k+'" aria-label="'+(k==='⌫'?'Borrar último':k)+'">'+k+'</button>':'<span></span>'}).join('')
    +'</div><div class="np-act"><button class="btn" data-act="npClear">Borrar todo</button><button class="btn" data-act="close" data-l="2">Cancelar</button><button class="btn pri" data-act="npOk">Listo</button></div>',{layer:2,noFocus:true});
  npPaint();
}
function npPaint(){var d=$('#npDisp');if(!d||!U.np)return;var s=U.np.str;if(!s){d.textContent='Escribí el número';d.className='np-disp empty-v'}else{d.textContent=U.np.pin?s.replace(/./g,'•'):s;d.className='np-disp'}}
function npKey(k){
  var n=U.np;if(!n)return;
  if(k==='⌫'){n.str=n.str.slice(0,-1);n.fresh=false}
  else{if(n.fresh){n.str='';n.fresh=false}
    if(k===','){if(!n.dec||n.str.indexOf(',')>-1)return;if(!n.str)n.str='0'}
    else{var dp=n.str.indexOf(',');if(dp>-1&&n.str.length-dp>3)return;if(n.str==='0')n.str=''}
    if(n.str.length>=12)return;n.str+=k}
  npPaint();
}
function npOk(){var n=U.np;if(!n)return;var v=n.str===''?null:parseFloat(n.str.replace(',','.'));var cb=n.onDone;closeModal(2);if(cb)cb(v)}

function freeSlots(day,proId,dur,opts){

  data.forEach(function(d,i){

function apLog(a,state,why){a.log=a.log||[];a.log.push({t:now(),state:state,user:U.user?U.user.name:'Web',why:why||''})}
function apSet(state,why){
  var a=apptById(U.openAppt);if(!a||!mineOrAll(a))return;
  if((state==='confirmado'||state==='cancelado'||state==='no_vino')&&!can('todas_agendas')){toast('Eso lo hace recepción.');return}
  var prev=a.state;a.state=state;apLog(a,state,why);
  audit('Turno: '+AST[state].l,a.name+' · '+cap(shortDate(a.start))+' '+hhmm(a.start)+' · antes '+AST[prev].l+(why?' · '+why:''));
  commit();
}
function remindText(a){var p=userById(a.pro);return 'Hola '+first(a.name)+'! Te esperamos el '+longDate(a.start)+' a las '+hhmm(a.start)+' h en '+S.biz.name+' ('+S.biz.address+') para '+apptLabel(a)+(p?' con '+first(p.name):'')+'. ¿Nos confirmás? Si no podés venir, avisanos así liberamos el lugar.'}
function apRemind(confirmToo){
  var a=apptById(U.openAppt),k=a&&clientById(a.clientId);if(!a)return;
  if(!k||!k.consent){toast('El cliente no dio consentimiento para WhatsApp.');return}
  if(confirmToo){a.state='confirmado';apLog(a,'confirmado','Avisado por WhatsApp')}
  audit('WhatsApp de turno',a.name+' · '+(confirmToo?'confirmación':'recordatorio'));commit();
  openWA(k.wa,confirmToo?'Hola '+first(a.name)+'! Tu turno quedó confirmado: '+longDate(a.start)+' a las '+hhmm(a.start)+' h para '+apptLabel(a)+'. Te esperamos en '+S.biz.address+'.':remindText(a));
}
async function apCancel(noShow){
  var a=apptById(U.openAppt);if(!a)return;
  var why=await confirmBox({title:noShow?'Marcar que no vino':'Cancelar turno',text:esc(a.name)+' · '+esc(cap(shortDate(a.start)))+' '+hhmm(a.start)+'. El horario queda libre en la agenda'+(noShow?'.':' y en la reserva online.'),input:{label:'Motivo',required:true,placeholder:noShow?'Ej.: no respondió los mensajes':'Ej.: avisó que no puede'},ok:noShow?'No vino':'Cancelar turno',danger:true});
  if(!why)return;apSet(noShow?'no_vino':'cancelado',why);
}
async function apDeposit(){
  var a=apptById(U.openAppt);if(!a||!a.deposit)return;
  var ok=await confirmBox({title:'Registrar seña',text:'¿Recibiste '+money(a.deposit.due)+' por transferencia al alias '+esc(S.biz.alias)+'? Se descuenta del total al cobrar.',ok:'Sí, recibida'});
  if(!ok)return;a.deposit.paid=a.deposit.due;a.deposit.medio='QR / Transferencia';a.deposit.t=now();
  if(a.state==='pendiente'){a.state='confirmado';apLog(a,'confirmado','Seña recibida')}
  audit('Seña recibida',a.name+' · '+money(a.deposit.paid));commit();toast('Seña registrada');
}
function apFinish(){
  var a=apptById(U.openAppt);if(!a||!mineOrAll(a))return;
  a.state='terminado';apLog(a,'terminado');audit('Atención terminada',a.name+' · '+apptLabel(a));commit({silent:true});
  if(can('cobrar')){closeDrawer();posLoadAppt(a.id)}else{rerender();toast('Listo. Recepción ya lo ve para cobrar.')}
}
function apReview(){
  var a=apptById(U.openAppt),k=a&&clientById(a.clientId);if(!k||!k.consent){toast('Sin consentimiento para WhatsApp.');return}
  askReview(k);
}
function askReview(k){
  S.reviewAsks.unshift({id:uid('rv'),t:now(),clientId:k.id,name:k.name,user:U.user.name});audit('Pedido de reseña',k.name);commit({silent:true});
  openWA(k.wa,'Hola '+first(k.name)+'! Gracias por venir a '+S.biz.name+'. Si te gustó, ¿nos dejás una reseña en Google? Nos ayuda muchísimo: '+reviewURL());
}

    if(F.newWA&&!wa){w.innerHTML='<div class="warn-box">Revisá el WhatsApp (código de área y número).</div>';return}}
  if(overlaps(busyOf(F.day,F.pro,F.id),F.time,dur)&&!F.force){w.innerHTML='<div class="warn-box">Se superpone con otro turno. Elegí otro horario o marcá "sobreturno".</div>';return}

      audit('Cliente nuevo',k.name+' · sin consentimiento de WhatsApp (pedirlo en la visita)')}}
  var its=F.items.map(function(id){var it=itemById(id);return {id:it.id,name:it.name,price:it.price,dur:it.dur,cat:it.cat}}),start=atMin(F.day,F.time);
  if(F.id){var a=apptById(F.id),before=cap(shortDate(a.start))+' '+hhmm(a.start)+' · '+first((userById(a.pro)||{}).name);
    a.items=its;a.dur=dur;a.pro=F.pro;a.start=start;a.origin=F.origin;a.note=(F.note||'').trim();apLog(a,a.state,'Reprogramado (antes '+before+')');

    closeModal(1);U.agDay=startOfDay(start);commit();toast('Turno actualizado');
    if(k&&k.consent)setTimeout(async function(){var ok=await confirmBox({title:'¿Avisar el cambio?',text:'Mandarle a '+esc(first(k.name))+' el nuevo día y horario por WhatsApp.',ok:'Avisar por WhatsApp'});if(ok)openWA(k.wa,'Hola '+first(k.name)+'! Te reprogramamos el turno: '+longDate(a.start)+' a las '+hhmm(a.start)+' h para '+apptLabel(a)+'. Cualquier cosa avisanos.')},60);
    return}

  apLog(na,'confirmado','Cargado por '+U.user.name);S.appts.push(na);
  audit('Turno cargado',na.name+' · '+cap(shortDate(start))+' '+hhmm(start)+' · '+first((userById(F.pro)||{}).name)+' · '+apptLabel(na)+(F.force?' · SOBRETURNO':''));
  closeModal(1);U.agDay=startOfDay(start);if(U.view!=='agenda')go('agenda');else commit();commit({silent:true});toast('Turno agendado: '+hhmm(start)+' h');

function posAdd(id){
  var it=itemById(id);if(!it)return;
  if(it.kind==='prod'){var inT=U.pos.lines.filter(function(x){return x.ref===id}).reduce(function(a,x){return a+x.qty},0);if(it.stock!=null&&inT+1>it.stock){toast('Stock insuficiente de '+it.name+'. Quedan '+it.stock+'.');return}}
  var pro=defaultProFor(it),l=U.pos.lines.filter(function(x){return x.ref===id&&x.pro===pro&&x.price===it.price})[0];
  if(l)l.qty++;else U.pos.lines.push({id:uid('l'),kind:it.kind,ref:id,name:it.name,qty:1,price:it.price,listPrice:it.price,pro:pro});
  U.pos.sel=l?U.pos.lines.indexOf(l):U.pos.lines.length-1;renderView();
}
async function posLoadAppt(id){
  var a=apptById(id);if(!a)return;
  if(U.pos.lines.length&&U.pos.apptId!==id){var ok=await confirmBox({title:'Reemplazar el ticket',text:'Hay un ticket en curso. ¿Lo reemplazo por el turno de '+esc(a.name)+'?',ok:'Reemplazar'});if(!ok)return}
  U.pos.lines=a.items.map(function(i){var it=itemById(i.id);return {id:uid('l'),kind:'serv',ref:i.id,name:i.name,qty:1,price:i.price,listPrice:it?it.price:i.price,pro:a.pro}});
  U.pos.apptId=a.id;U.pos.client=a.clientId;U.pos.sel=0;U.pos.tab='serv';
  if(U.view!=='cobrar')go('cobrar');else renderView();
  toast('Turno de '+first(a.name)+' cargado. Sumá productos si llevó algo.');
}
function scanCode(code){
  code=String(code).trim();var p=S.items.filter(function(x){return x.barcode&&x.barcode===code})[0];
  if(p){posAdd(p.id);toast('Leído: '+p.name);return true}return false;
}

async function ncDo(id){

  var why=await confirmBox({title:(s.cae?'Nota de crédito ':'Anular ')+s.nro,text:'Total '+money(s.total+s.tip)+' · '+esc(s.origin)+'. Se devuelve el stock, los sellos y el fiado.',input:{label:'Motivo',required:true},ok:s.cae?'Emitir nota de crédito':'Anular venta',danger:true});
  if(!why)return;
  s.anulada=true;s.anulReason=why;s.anulBy=U.user.name;s.anulT=now();
  s.lines.forEach(function(l){var it=itemById(l.ref);if(it&&it.kind==='prod'&&it.stock!=null)it.stock+=l.qty});
  var k=s.clientId?clientById(s.clientId):null;
  s.payments.forEach(function(p){if(p.medio==='Cuenta corriente'&&k){k.balance=r2(Math.max(0,k.balance-p.amount));if(!k.balance)k.balSince=null}});
  if(k){if(s.stamp)k.stamps=Math.max(0,(k.stamps||0)-1);if(s.reward)k.stamps=(k.stamps||0)+goalOf();k.visits=Math.max(0,(k.visits||1)-1)}
  if(s.apptId){var a=apptById(s.apptId);if(a){a.state='terminado';a.saleId=null;apLog(a,'terminado','Venta anulada: '+why)}}
  audit(s.cae?'Nota de crédito':'Anulación de venta',s.nro+' · '+money(s.total+s.tip)+' · '+why);closeModal(1);commit();toast('Venta '+s.nro+' anulada');
}

  var proIds=[];U.pos.lines.forEach(function(l){if(l.pro&&proIds.indexOf(l.pro)<0)proIds.push(l.pro)});
  U.cobro={subtotal:posTotal(),discount:0,discountWhy:'',reward:false,tip:0,tipPro:proIds[0]||null,payments:dep?[{medio:'QR / Transferencia',amount:Math.min(dep,posTotal()),note:'Seña',locked:true}]:[],medio:medio||'Efectivo',client:U.pos.client,arca:U.pos.arca,change:0};

function cobroRest(){return r2(cobroDue()-cobroPaid())}
function rewardValue(){var g=U.pos.lines.filter(function(l){return l.kind==='serv'}).map(function(l){return l.price}).sort(function(a,b){return b-a})[0]||0;return r2(Math.min(g*(S.biz.stamps.rewardPct||0)/100,S.biz.stamps.rewardMax||Infinity))}

function cbAddPayment(silent){
  var c=U.cobro,rest=cobroRest();if(rest<=0)return true;

    var k=clientById(cid),already=c.payments.filter(function(p){return p.medio==='Cuenta corriente'}).reduce(function(a,p){return a+p.amount},0);

  c.payments.push({medio:c.medio,amount:amt,client:c.medio==='Cuenta corriente'?cid:null});

async function cbConfirm(){
  var c=U.cobro;if(!c)return;

  if(cobroRest()<0){renderCobro();$('#cbWarn').innerHTML='<div class="warn-box">Los pagos superan el total. Quitá o corregí un pago.</div>';return}

  var a=U.pos.apptId?apptById(U.pos.apptId):null,k=c.client?clientById(c.client):null,firstPro=lines.filter(function(l){return l.pro})[0];
  S.seq.ti++;
  var sale={id:uid('s'),nro:(c.arca?'F'+(S.biz.facturaTipo||'C')+' 0002-':'0001-')+pad(S.seq.ti,8),doc:c.arca?'fiscal':'interno',t:now(),origin:a?'Turno '+hhmm(a.start)+' · '+first((userById(a.pro)||{}).name):'Mostrador'+(firstPro?' · '+first((userById(firstPro.pro)||{}).name):''),
    apptId:a?a.id:null,clientId:k?k.id:null,lines:lines,subtotal:sub,discount:r2(c.discount),discountWhy:c.discountWhy,total:r2(sub-c.discount),tip:r2(c.tip||0),tipPro:c.tip?c.tipPro:null,
    payments:c.payments.map(function(p){return {medio:p.medio,amount:p.amount,note:p.note||'',client:p.client||null}}),change:c.change||0,user:U.user.name,cajaId:S.cash.id,anulada:false,cae:null,stamp:false,reward:!!c.reward};
  S.sales.push(sale);
  lines.forEach(function(l){var it=itemById(l.ref);if(it&&it.kind==='prod'&&it.stock!=null){it.stock-=l.qty}});
  sale.payments.forEach(function(p){if(p.medio==='Cuenta corriente'&&k){if(!k.balance)k.balSince=now();k.balance=r2(k.balance+p.amount);S.clientMoves.push({id:uid('cm'),t:now(),client:k.id,type:'cargo',amount:p.amount,ref:sale.nro,user:U.user.name})}});
  if(k){

    if(c.reward){k.stamps=Math.max(0,(k.stamps||0)-goalOf());audit('Canje de premio de sellos',k.name+' · '+money(c.discount))}
    else if(hasServ&&k.lastStamp!==dayKey()){k.stamps=(k.stamps||0)+1;k.lastStamp=dayKey();sale.stamp=true}

function shiftStats(){
  var ss=salesOfShift().filter(function(s){return !s.anulada}),by={},tot=0,tip=0,cash=0,fiscal=0,interno=0,serv=0,prod=0;
  MED_ORDER.forEach(function(m){by[m]=0});
  ss.forEach(function(s){tot+=s.total;tip+=s.tip;if(s.doc==='fiscal')fiscal+=s.total;else interno+=s.total;
    s.lines.forEach(function(l){var v=lineShare(s,l);if(l.kind==='serv')serv+=v;else prod+=v});
    s.payments.forEach(function(p){by[p.medio]=(by[p.medio]||0)+p.amount;if(p.medio==='Efectivo')cash+=p.amount})});
  var mv=S.cash&&S.cash.moves||[],ing=0,egr=0,rei=0,cob=0;

  return {sales:ss,count:ss.length,by:by,total:r2(tot),tip:r2(tip),cash:r2(cash),fiscal:r2(fiscal),interno:r2(interno),serv:r2(serv),prod:r2(prod),ing:r2(ing),egr:r2(egr),rei:r2(rei),cob:r2(cob),anul:salesOfShift().filter(function(s){return s.anulada})};
}

function cliMatches(k){
  var q=U.cliQ.trim().toLowerCase(),f=U.cliF,g=goalOf();
  if(q&&k.name.toLowerCase().indexOf(q)<0&&onlyDigits(k.wa).indexOf(onlyDigits(q)||'~')<0)return false;
  if(f==='fiado')return k.balance>0;
  if(f==='premio')return (k.stamps||0)>=g;
  if(f==='cumple')return birthdaysWeek().indexOf(k)>-1;
  if(f==='volver')return k.lastVisit&&now()-k.lastVisit>45*864e5;
  return true;

function parseBirthday(s){
  s=String(s||'').trim();if(!s)return '';
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/)||s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/)||s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m)return null;var d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return null;
  var y=m[3]?(m[3].length===2?(+m[3]>40?'19':'20')+m[3]:m[3]):'';
  return pad(d,2)+'/'+pad(mo,2)+(y?'/'+y:'');
}

function readPhoto(file){
  if(!file||!/^image\//.test(file.type)){toast('Elegí una imagen.');return}
  if(file.size>15*1024*1024){toast('La foto pesa más de 15 MB.');return}
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var max=720,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);U.itemPhoto=c.toDataURL('image/jpeg',0.82);var el=$('#ifImg');if(el)el.src=U.itemPhoto};
  img.onerror=function(){toast('No se pudo leer la imagen.')};img.src=url;
}
function saveItem(f){
  var id=f.getAttribute('data-id'),kind=f.getAttribute('data-k'),it=id?itemById(id):null,w=$('#ifWarn'),sv=kind==='serv';
  var name=($('#ifName').value||'').trim(),price=$('#ifPrice').valueAsNumber;
  if(name.length<2){w.innerHTML='<div class="warn-box">Escribí el nombre.</div>';return}
  if(!(price>0)){w.innerHTML='<div class="warn-box">El precio tiene que ser mayor a cero.</div>';return}
  if(sv){var dur=$('#ifDur').valueAsNumber;if(!(dur>=5)){w.innerHTML='<div class="warn-box">La duración mínima es 5 minutos.</div>';return}}
  else{var stock=$('#ifStock').valueAsNumber;if(!(stock>=0)||stock%1){w.innerHTML='<div class="warn-box">El stock va entero y no puede ser negativo.</div>';return}
    var code=($('#ifCode').value||'').trim();if(code&&S.items.some(function(x){return x.barcode===code&&x!==it})){w.innerHTML='<div class="warn-box">Ese código ya está cargado.</div>';return}}
  var isNew=!it;if(!it){it={kind:kind,id:uid(sv?'sv':'pr'),ill:sv?CFG.defaultIll:'bottle',cost:0,published:false};S.items.push(it)}
  if(!isNew&&it.price!==price)audit('Cambio de precio de lista',name+' · '+money(it.price)+' → '+money(price));
  it.name=name;it.price=r2(price);it.desc=($('#ifDesc').value||'').trim();it.status=$('#ifStatus').value;it.published=$('#ifPub').checked;it.photo=U.itemPhoto||null;
  if(sv){it.cat=$('#ifCat').value;it.dur=$('#ifDur').valueAsNumber;it.from=$('#ifFrom').checked;it.deposit=$('#ifDep').checked}
  else{it.cat='prod';if(!isNew&&it.stock!==$('#ifStock').valueAsNumber)audit('Ajuste de stock',name+' · '+it.stock+' → '+$('#ifStock').valueAsNumber);it.stock=$('#ifStock').valueAsNumber;it.barcode=($('#ifCode').value||'').trim();var cst=$('#ifCost').valueAsNumber;it.cost=cst>=0?cst:0}
  if(isNew)audit(sv?'Servicio nuevo':'Producto nuevo',name+' · '+money(price)+(it.published?' · publicado':''));
  closeModal(1);commit();toast('Guardado'+(it.published?' · ya se ve en la web':''));
}

/* Respaldo cifrado AES-256-GCM con clave derivada por PBKDF2-SHA256 (200.000) */
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveKey(pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backupDl(){
  if(!(window.crypto&&crypto.subtle)){toast('Este navegador no permite cifrar acá. Abrilo con https o desde el programa de Windows.');return}
  var p=await confirmBox({title:'Clave del respaldo',text:'Elegí una clave de al menos 8 caracteres y guardala: sin ella el respaldo no se puede abrir.',input:{label:'Clave',required:true,placeholder:'Mínimo 8 caracteres'},ok:'Cifrar y descargar'});
  if(!p)return;if(p.length<8){toast('La clave tiene que tener al menos 8 caracteres.');return}
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(S)));
  downloadBlob('respaldo-'+CFG.key+'-'+dayKey()+'.rave.json',new Blob([JSON.stringify({app:'Sistema RAVE',biz:S.biz.name,v:1,kdf:'PBKDF2-SHA256',iter:200000,cipher:'AES-256-GCM',salt:b64(salt),iv:b64(iv),ct:b64(ct),t:now()})],{type:'application/json'}));
  S.lastBackup=now();audit('Respaldo descargado','Cifrado AES-256-GCM');commit({silent:true});toast('Respaldo descargado');
}
async function backupRestore(file){
  try{
    if(!(window.crypto&&crypto.subtle)){toast('Este navegador no permite descifrar acá.');return}
    var txt=await file.text(),o=JSON.parse(txt);if(!o.ct||!o.salt||!o.iv)throw new Error('formato');
    var p=await confirmBox({title:'Restaurar respaldo',text:'Respaldo de '+esc(o.biz||'')+' del '+fdt(o.t)+'. Reemplaza TODOS los datos de este equipo.',input:{label:'Clave del respaldo',required:true},ok:'Restaurar',danger:true});if(!p)return;
    var key=await deriveKey(p,unb64(o.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)),st=JSON.parse(new TextDecoder().decode(plain));
    if(!st||!st.biz||!st.items||!st.appts)throw new Error('contenido');
    S=st;audit('Respaldo restaurado','Archivo '+file.name);await persistNow();toast('Respaldo restaurado');logout('Datos restaurados: volvé a ingresar');
  }catch(e){toast(e&&e.name==='OperationError'?'Clave incorrecta o archivo dañado.':'No es un respaldo válido del Sistema RAVE.')}
}
