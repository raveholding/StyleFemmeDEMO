  demoReset:async function(){var a=await confirmBox({title:'Reiniciar datos de ejemplo',text:'Se borra TODO lo cargado en este equipo y vuelven los datos de ejemplo.',ok:'Continuar',danger:true});if(!a)return;var b=await confirmBox({title:'¿Seguro?',text:'No se puede deshacer. Si querés guardar algo, descargá antes un respaldo.',ok:'Reiniciar',danger:true});if(!b)return;S=seedState();await sealSeedClosures(S);await persistNow();logout('Datos de ejemplo reiniciados')}
};
Object.keys(POS_ACT).forEach(function(k){ACT[k]=POS_ACT[k]});
document.addEventListener('click',function(e){
  if(U.user)U.lastAct=Date.now();
  var ov=e.target.closest('.overlay');if(ov&&e.target===ov){closeModal(ov.id==='overlay2'?2:1);return}
  if(e.target.id==='drawerO'){closeDrawer();return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='agSlot'){if(e.target.closest('.appt'))return;agSlotClick(el,e);return}
  if(el.tagName==='A')return;
  var f=ACT[a];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='cashMoveForm')saveCashMove(f);else if(f.id==='closeCashForm')doCloseCash();else if(f.id==='openCashForm')openCash();
  else if(f.id==='cliForm')saveCli(f);else if(f.id==='cliPayForm')saveCliPay(f);else if(f.id==='userForm')saveUser(f);else if(f.id==='itemForm')saveItem(f);
  else if(f.id==='adminForm')saveAdmin();
  else if(f.id==='reviewForm'){var v=($('#rvUrl').value||'').trim();if(v&&!/^https:\/\//.test(v)){toast('El enlace tiene que empezar con https://');return}S.biz.reviewUrl=v;audit('Enlace de reseñas',v||'(vacío)');commit();toast('Enlace guardado')}
  else if(f.id==='catAddForm'){var n=($('#catNew').value||'').trim();if(n.length<2)return;S.cats.push({id:uid('c'),name:n});audit('Categoría nueva',n);commit({silent:true});catCatsModal()}
});
document.addEventListener('input',function(e){
  var t=e.target,ch=t.getAttribute('data-ch');
  if(t.id==='posSearch'){U.pos.q=t.value;renderView();return}
  if(t.id==='cliQ'){U.cliQ=t.value;renderView();return}
  if(t.id==='catQ'){U.catQ=t.value;renderView();return}
  if(t.id==='auditQ'){U.auditQ=t.value;renderView();return}
  if(t.id==='leQ'||t.id==='leP'||t.id==='leI'){leSync(t.id);return}
  if(t.classList.contains('dn')){ccSync('dn');return}
  if(t.id==='ccDecl'){ccSync('decl');return}
  if(t.id==='cbWith'||t.id==='cbAmt'){cbVuelto();return}
  if(t.id==='cbTip'){var v=t.valueAsNumber;U.cobro.tip=v>0?r2(v):0;var k=saveFocus();renderCobro();restoreFocus(k);return}
  if(ch==='bkField'&&t.type!=='checkbox'){U.book[t.getAttribute('data-f')]=t.value;return}
  if(ch==='afText'){U.af[t.getAttribute('data-f')]=t.value;return}
  if(ch==='catName'){var c=catById(t.getAttribute('data-id'));if(c&&t.value.trim()){c.name=t.value.trim();commit({silent:true})}return}
});
document.addEventListener('change',function(e){
  var t=e.target,ch=t.getAttribute('data-ch');
  if(t.id==='posClient'){U.pos.client=t.value||null;return}
  if(t.id==='posPro'){U.pos.pro=t.value||null;return}
  if(t.id==='cbClient'){U.cobro.client=t.value||null;if(U.cobro.reward){U.cobro.reward=false;U.cobro.discount=0}renderCobro();return}
  if(t.id==='cbTipPro'){U.cobro.tipPro=t.value;return}
  if(t.id==='agDate'){if(t.value){var p=t.value.split('-');U.agDay=new Date(+p[0],+p[1]-1,+p[2]).getTime();renderView()}return}
  if(t.id==='ifPhoto'){readPhoto(t.files&&t.files[0]);return}
  if(t.id==='backupFile'){if(t.files&&t.files[0])backupRestore(t.files[0]);t.value='';return}
  if(ch==='bkAdd'){if(t.value&&U.sel.indexOf(t.value)<0)U.sel.push(t.value);renderBook();return}
  if(ch==='bkField'&&t.type==='checkbox'){U.book[t.getAttribute('data-f')]=t.checked;return}
  if(ch==='afClient'){U.af.clientId=t.value;renderAF();return}
  if(ch==='afOrigin'){U.af.origin=t.value;return}
  if(ch==='afPro'){U.af.pro=t.value;U.af.time=null;renderAF();return}
  if(ch==='afDay'){if(t.value){var q=t.value.split('-');U.af.day=new Date(+q[0],+q[1]-1,+q[2]).getTime();U.af.time=null;renderAF()}return}
  if(ch==='afTime'){U.af.time=t.value?hm2min(t.value):null;renderAF();return}
  if(ch==='afForce'){U.af.force=t.checked;return}
  if(ch==='catSel'){U.catSel[t.getAttribute('data-id')]=t.checked;renderView();return}
  if(ch==='gCheck'){S.googleChecks[t.getAttribute('data-k')]=t.checked;audit('Checklist de Google',t.getAttribute('data-k')+': '+(t.checked?'hecho':'pendiente'));commit();return}
  if(ch==='adInact'){S.biz.inactivityMin=+t.value;audit('Cierre por inactividad',t.value+' min');commit({silent:true});return}
});
/* Un número que ya trae valor se selecciona entero al entrar (también con clic) */
document.addEventListener('focusin',function(e){var t=e.target;if(t.tagName==='INPUT'&&(t.type==='number'||t.classList.contains('mono'))&&t.value!==''){setTimeout(function(){try{t.select()}catch(x){}},0)}});
document.addEventListener('mouseup',function(e){var t=e.target;if(t.tagName==='INPUT'&&t.type==='number'&&document.activeElement===t&&t.dataset.sel!=='1'){t.dataset.sel='1';e.preventDefault()}});
document.addEventListener('focusout',function(e){if(e.target.dataset)delete e.target.dataset.sel});

/* ----------------------------------------------------- Teclado: F1–F12 sólo en Cobrar y en el cobro; lector de códigos */
var SCAN={buf:'',t:0};
document.addEventListener('keydown',function(e){
  if(U.user)U.lastAct=Date.now();
  var k=e.key,layer=topLayer();
  if(k==='Escape'){if(layer===2){if(CONF)confAnswer(false);else closeModal(2)}else if(layer===1)closeModal(1);else if(layer==='drawer')closeDrawer();return}
  if(layer===2&&U.np&&!e.ctrlKey&&!e.metaKey){if(/^[0-9]$/.test(k)){npKey(k);e.preventDefault();return}if(k===','||k==='.'){npKey(',');e.preventDefault();return}if(k==='Backspace'){npKey('⌫');e.preventDefault();return}if(k==='Enter'){npOk();e.preventDefault();return}}
  if(layer===2&&CONF&&k==='Enter'&&e.target.id!=='confIn'){confAnswer(true);e.preventDefault();return}
  if(U.view==='login'&&LOGIN.uid&&/^[0-9]$/.test(k)&&!layer){pinKey(k);return}
  if(U.view==='login'&&LOGIN.uid&&k==='Backspace'&&!layer){pinKey('⌫');return}
  var inCobro=modalKey()==='cobro'&&layer===1,inPos=U.view==='cobrar'&&!!U.user&&(!layer||inCobro);
  if(/^F([1-9]|1[0-2])$/.test(k)&&(inPos||inCobro)){
    e.preventDefault();
    if(inCobro){var map={F1:'Efectivo',F2:'Débito',F3:'Crédito',F4:'Cuenta corriente'};
      if(map[k]){U.cobro.medio=map[k];U.cobro.client=$('#cbClient').value||null;renderCobro();if(k==='F4')setTimeout(function(){var s=$('#cbClient');if(s)s.focus()},20)}
      else if(k==='F8')POS_ACT.posArca();else if(k==='F12')cbConfirm();return}
    var f=FKEYS.filter(function(x){return x[0]===k})[0];if(f)POS_ACT[f[2]](null,f[3]);return
  }
  /* Lector de código de barras (modo teclado): ráfaga de dígitos + Enter */
  if(inPos&&!layer){
    var nowT=Date.now(),inField=e.target.tagName==='INPUT'&&e.target.id!=='posSearch';
    if(/^[0-9]$/.test(k)&&!inField){if(nowT-SCAN.t>60)SCAN.buf='';SCAN.buf+=k;SCAN.t=nowT}
    else if(k==='Enter'&&SCAN.buf.length>=8&&nowT-SCAN.t<80){var code=SCAN.buf;SCAN.buf='';if(scanCode(code)){e.preventDefault();if(e.target.id==='posSearch'){U.pos.q='';renderView()}}}
    else if(k==='Enter'&&e.target.id==='posSearch'){if(scanCode(e.target.value)){U.pos.q='';renderView()}}
  }
});

/* ----------------------------------------------------- Arranque */
function handleHash(){
  var h=location.hash||'';
  if(h.indexOf('#t=')===0){var p=h.slice(3).split('.'),ok=p.length===2&&clientById(p[0])&&cardSig(p[0])===p[1];U.publicCard=ok?p[0]:null;U.view='card';render();return true}
  if(h==='#reservar'){U.view='menu';render();bookStart();return true}
  if(h.indexOf('#s=')===0){U.view='menu';render();var id=h.slice(3);if(itemById(id))mnZoom(id);return true}
  return false;
}
function applyStateFromOtherTab(st){
  if(!st)return;S=st;
  if(U.user){var u=userById(U.user.id);if(!u||u.active===false){logout('Tu usuario fue desactivado');return}U.user=u}
  checkNewOnline();
  var l=topLayer();
  if(l===1||l===2){if(U.view!=='menu'&&U.view!=='login'&&SHELL&&$('#nav'))renderNav();return}
  rerender();
}
async function boot(){
  document.getElementById('fav').href=faviconURL();
  if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)document.documentElement.classList.add('touch');
  var st=null;try{st=await idbGet('state')}catch(e){STORE_OK=false}
  var fresh=!st||st.version!==SEED_VERSION||st.key!==CFG.key||(st.demoRefresh!==false&&st.seedDay!==dayKey());
  if(fresh){S=seedState();if(st&&st.demoRefresh===false)S.demoRefresh=false;await sealSeedClosures(S);await persistNow()}else S=st;
  if(!STORE_OK)setTimeout(function(){toast('Este navegador no permite guardar datos acá: la demo funciona pero no guarda al recargar.')},800);
  U.agDay=startOfDay();
  if(!handleHash())render();
  if(BC)BC.onmessage=function(m){if(m.data&&m.data.from!==TAB_ID)idbGet('state').then(applyStateFromOtherTab).catch(function(){})};
  window.addEventListener('hashchange',function(){if(!U.user||(location.hash||'').indexOf('#t=')===0)handleHash()});
  setInterval(function(){
    if(U.user&&Date.now()-U.lastAct>(S.biz.inactivityMin||15)*60000){logout('Sesión cerrada por inactividad');return}
    if(U.user&&U.view==='agenda'&&!topLayer())rerender();
  },30000);
}
window.RAVE_TEST={get S(){return S},U:U,CLOCK:CLOCK,commit:commit,persistNow:persistNow,seedState:seedState,freeSlots:freeSlots,proStats:proStats,cardSig:cardSig,hmac256:hmac256,normWA:normWA,parseBirthday:parseBirthday,idbGet:idbGet};
boot();

})();
